spring.application.name=club-manager

# Database Configuration (Railway placeholders)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# JWT Configuration (Safe placeholder that reads from Railway)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (defaults to localhost for development, reads from Railway in production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://retro-admin-frontend.vercel.app)}