spring.application.name=club-manager

# Database Configuration (Railway placeholders)
spring.data.mongodb.uri=mongodb://localhost:27017/club_manager_chat

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/club_manager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root@2026}

spring.datasource.url=jdbc:mysql://localhost:3306/club_manager?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration (Safe placeholder that reads from Railway)
# A pure alphanumeric string without dashes or special characters
jwt.secret=${JWT_SECRET:MySuperSecretLocalDevelopmentKeyThatIsAtLeast256BitsLongAndHasNoDashes123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (defaults to localhost for development, reads from Railway in production)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173